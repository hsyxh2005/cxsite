<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你的名字 · 个人页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部进度条 -->
  <div id="progress-bar" class="progress-bar"></div>

  <!-- 顶部导航 -->
  <nav class="nav">
    <div class="nav-brand" id="nav-brand">你的名字</div>
    <div class="nav-links" id="nav-links">
      <a href="#home" class="active">首页</a>
      <a href="#projects">开发</a>
      <a href="#articles">文章</a>
      <a href="#essays">随笔</a>
      <a href="#about">关于</a>
    </div>
    <div class="nav-right">
      <input type="text" id="search-input" class="search-input" placeholder="搜索…">
      <button id="theme-toggle" class="theme-btn" title="切换深色模式">🌙</button>
    </div>
  </nav>

  <!-- 搜索结果显示区域 -->
  <div id="search-results" class="search-results hidden"></div>

  <!-- 主内容容器 -->
  <main id="main-content">
    <!-- 首页 -->
    <section class="hero section active-section" id="section-home">
      <h1 id="hero-name">你的名字</h1>
      <p class="subtitle" id="hero-title">会计专业 · 自用软件开发者</p>
      <p id="hero-intro" class="hero-intro"></p>
    </section>

    <!-- 开发情况 -->
    <section class="section hidden" id="section-projects">
      <h2 class="section-title">开发情况</h2>
      <div id="projects-container"></div>
    </section>

    <!-- 文章 -->
    <section class="section hidden" id="section-articles">
      <h2 class="section-title">文章</h2>
      <div id="articles-container"></div>
    </section>

    <!-- 随笔 -->
    <section class="section hidden" id="section-essays">
      <h2 class="section-title">随笔</h2>
      <div id="essays-container"></div>
    </section>

    <!-- 关于 -->
    <section class="section hidden" id="section-about">
      <h2 class="section-title">关于</h2>
      <div id="about-container"></div>
    </section>

    <!-- 详情页容器（文章/随笔详情） -->
    <div id="detail-view" class="hidden detail-view">
      <button id="back-btn" class="back-btn">← 返回</button>
      <div id="detail-content"></div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <p>© <span id="year"></span> 你的名字 · 部分项目仅供自用</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
